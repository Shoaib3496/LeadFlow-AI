<!DOCTYPE html>
<html>

<head>

<title>CRM Analytics</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>CRM Analytics</h2>

<div class="row">

<div class="col-md-4">

<div class="card">

<div class="card-body">

<h5>Total Leads</h5>

<h2>{{ analytics.total }}</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card">

<div class="card-body">

<h5>Contacted</h5>

<h2>{{ analytics.contacted }}</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card">

<div class="card-body">

<h5>Meetings</h5>

<h2>{{ analytics.meeting }}</h2>

</div>

</div>

</div>

</div>

<br>

<div class="row">

<div class="col-md-4">

<div class="card bg-warning">

<div class="card-body">

<h5>Proposals</h5>

<h2>{{ analytics.proposal }}</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card bg-success text-white">

<div class="card-body">

<h5>Won</h5>

<h2>{{ analytics.won }}</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card bg-danger text-white">

<div class="card-body">

<h5>Lost</h5>

<h2>{{ analytics.lost }}</h2>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
